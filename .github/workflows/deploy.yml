name: Publicar no Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar segredos
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Segredos CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID ainda não configurados. Pulando publicação."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Preparar pasta pública
        if: steps.check.outputs.ok == 'true'
        run: mkdir public && cp -R index.html img public/
      - name: Publicar
        if: steps.check.outputs.ok == 'true'
        run: npx --yes wrangler@4 pages deploy public --project-name=lucasguckert --branch=main --commit-dirty=true
